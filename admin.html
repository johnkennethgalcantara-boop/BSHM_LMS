   Everything else (programs, sections, subjects, students, enrollment, assignments, activity log) is in  bshm.db  */
(function(){'use strict';
const $=i=>document.getElementById(i),KEY='bshm.accounts',CRED='bshm.admin.cred',SESS='bshm.admin.session',DBK='bshm.db',UK='aces_users',TK='bshm.admin.theme';

const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Could not save. Browser storage may be full or blocked.');return false}};
const hex=u=>Array.from(u,x=>('0'+x.toString(16)).slice(-2)).join('');
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const uid=()=>'i'+Date.now().toString(36)+hex(rnd(2));
const hashPw=(salt,pw)=>{const s=salt+':'+pw;
 if(crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(b=>hex(new Uint8Array(b)));
 let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Promise.resolve('f'+(h>>>0).toString(16))};
const genPw=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r=rnd(10);return Array.from(r,x=>c[x%c.length]).join('')};

 const mx=Math.max(1,...yr.flatMap(r=>[r[1],r[2]])),pc=[['Active',USR.filter(u=>u.status==='verified').length,COL[0]],['Pending',USR.filter(u=>u.status!=='verified'&&u.status!=='disabled').length,COL[2]],['Disabled',USR.filter(u=>u.status==='disabled').length,COL[3]]],tot=USR.length;
 let a=0;const cg=tot?'conic-gradient('+pc.map(p=>{const s=a;a+=p[1]/tot*100;return p[2]+' '+s+'% '+a+'%'}).join(',')+')':'var(--tint)';
 const lgrows=D.log.slice(0,6).map(l=>'<tr><td data-l="Date">'+dstr(l.t)+'</td><td data-l="Type"><span class="pill a">'+esc(l.a)+'</span></td><td data-l="Details">'+esc(l.d)+'</td></tr>').join('')||'<tr><td colspan="3" class="none">No activity yet. Actions you take will show here.</td></tr>';
 const qa=[['sections','Add section'],['subjects','Add subject'],['enroll','Enroll student'],['assign','Assign faculty']].map(x=>'<button class="b o" data-go="'+x[0]+'" data-add="1">'+ic(x[0])+x[1]+'</button>').join('');
 return head('Department Admin Dashboard','Manage the BSHM department: academic records, accounts, LMS content and communication.')+
 '<div class="st"><div>Registered students<b>'+tot+'</b></div><div>Total faculty<b>'+teachers().length+'</b></div><div>Total subjects<b>'+D.subjects.length+'</b></div><div>Total sections<b>'+D.sections.length+'</b></div><div>Total enrollments<b>'+D.enroll.length+'</b></div></div>'+
 '<div class="g3"><div class="cd"><h3>Students and enrollments by year level</h3><div class="ch">'+yr.map(r=>'<div><i class="br" style="height:'+Math.max(2,r[1]/mx*100)+'%" title="Students: '+r[1]+'"></i><i class="br l" style="height:'+Math.max(2,r[2]/mx*100)+'%" title="Enrollments: '+r[2]+'"></i></div>').join('')+'</div><div class="lb">'+yr.map(r=>'<span>'+esc(r[0])+'<br>'+r[1]+' / '+r[2]+'</span>').join('')+'</div><p class="sub">Dark bar: students. Light bar: enrollments.</p></div>'+
 '<div class="cd"><h3>Student accounts</h3><div class="dn" style="background:'+cg+'"><i>'+tot+'<br>students</i></div><div class="lg">'+pc.map(p=>'<div><span><em style="background:'+p[2]+'"></em>'+esc(p[0])+'</span><b>'+p[1]+'</b></div>').join('')+'</div></div>'+
 '<div class="cd"><h3>Quick actions</h3><div class="qa">'+qa+'<button class="b o" data-go="r3">'+ic('acts')+'Grades & reports</button></div></div></div>'+
 '<div class="cd"><h3>Recent activities</h3><div class="tw"><table><thead><tr><th>Date</th><th>Type</th><th>Details</th></tr></thead><tbody>'+lgrows+'</tbody></table></div></div>'}

/* ---- reports & settings ---- */
function rep(){const t='Performance Reports',h=['Faculty','Assigned classes','Subjects'],
 r=teachers().map(f=>{const c=D.assign.filter(x=>x.facultyId===f.id);return [f.name,c.length,c.map(x=>x.subject).join(', ')||'-']});
 RP={t,h,r};
 return head(t,'Generated from the records in this system.','<span class="ac"><button class="b o" data-a="pr">Print</button><button class="b" data-a="csv">Export CSV</button></span>')+
 '<p class="note">Grades, quizzes, and pass rates will appear here once the LMS records them. For now this shows faculty load.</p>'+
 '<div class="cd tw"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(r.map(x=>'<tr>'+x.map((c,i)=>'<td data-l="'+esc(h[i])+'">'+esc(c)+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="9" class="none">No data to report yet.</td></tr>')+'</tbody></table></div>'}
function sett(){return head('Settings','School details shown across the admin pages.')+'<div class="cd fm" style="max-width:460px">'+inp('school','School name',D.set.school,'id="sn"')+inp('ay','Academic year',D.set.ay,'id="ay"')+'<button class="b" data-a="sv">Save settings</button></div>'}

/* ---- router ---- */
function nav(){$('nav').innerHTML=NAV.map(n=>Array.isArray(n[1])?'<p>'+n[0]+'</p>'+n[1].map(i=>link(i)).join(''):link(n)).join('')}
const link=i=>'<a href="#" data-n="'+i[0]+'"'+(pg===i[0]?' class="on" aria-current="page"':'')+'>'+ic(i[0])+'<span>'+(i[1]||E[i[0]].t)+'</span></a>';
function render(){nav();$('sch').textContent=D.set.school;$('pg').innerHTML=({dash,fac,students:stud,acts,res,ann,notif,logs}[pg]||(pg==='fac'?fac:pg==='sacc'?sacc:pg==='ban'?ban:pg==='set'?sett:pg==='r3'?rep:crud))()}
const go=p=>{pg=p;q='';menu(false);render();scrollTo(0,0)};
$('nav').onclick=e=>{const a=e.target.closest('[data-n]');if(a){e.preventDefault();go(a.dataset.n)}};
$('pg').addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.trim().toLowerCase();$('tb').innerHTML=RW()}});
$('pg').onclick=e=>{const b=e.target.closest('[data-a],[data-go]');if(!b)return;
 if(b.dataset.go){go(b.dataset.go);if(b.dataset.add)act('add');return}act(b.dataset.a,b.dataset.id)};
function act(a,id){const t=byId(id),u=su(id),bn=BNL.find(x=>x.id===id);
 if(a==='add'&&pg==='ban'){if(BNL.length>=8)return toast('You can keep up to 8 banners.');return banEdit()}
 if(a==='be'&&bn)return banEdit(bn);
 if((a==='bup'||a==='bdn')&&bn){const i=BNL.indexOf(bn),j=a==='bup'?i-1:i+1;if(j<0||j>=BNL.length)return;if(bsave(()=>{BNL[i]=BNL[j];BNL[j]=bn}))render();return}
 if(a==='btg'&&bn){const off=bn.active!==false;if(bsave(()=>{bn.active=!off})){lg('Banner',(off?'Hid ':'Showed ')+bn.title);render();toast(off?'Banner hidden.':'Banner visible.')}return}
 if(a==='bx'&&bn){if(!confirm('Delete the banner "'+bn.title+'"? This cannot be undone.'))return;if(bsave(()=>{BNL=BNL.filter(x=>x!==bn)})){lg('Banner','Deleted '+bn.title);render();toast('Banner deleted.')}return}
 if(a==='se'&&u)return stuEdit(u);
 if(a==='srp'&&u){if(!confirm('Reset the password for '+sfull(u)+'? Their current password will stop working.'))return;
  const pw=genPw(),salt=hex(rnd(8));return hashStu(salt,pw).then(h=>{const p=[u.salt,u.passwordHash];u.salt=salt;u.passwordHash=h;if(!saveU()){[u.salt,u.passwordHash]=p;return}lg('Student','Password reset for '+sfull(u));render();reveal('Password reset',{name:sfull(u),username:u.studentId},pw,'Student ID','student')})}
 if(a==='stg'&&u){const off=u.status!=='disabled';if(off&&!confirm('Disable '+sfull(u)+'? They cannot sign in until you enable the account again.'))return;
  const prev=u.status;u.status=off?'disabled':'verified';if(!saveU()){u.status=prev;return}lg('Student',(off?'Disabled ':'Enabled ')+sfull(u));render();return toast(off?'Account disabled.':'Account enabled.')}
 if(a==='sver'&&u){u.status='verified';delete u.otp;if(!saveU())return;lg('Student','Verified '+sfull(u));render();return toast('Account verified.')}
 if(a==='sx'&&u){if(!confirm('Delete the account for '+sfull(u)+'? This cannot be undone.'))return;const i=USR.indexOf(u);USR.splice(i,1);if(!saveU()){USR.splice(i,0,u);return}lg('Student','Deleted '+sfull(u));render();return toast('Account deleted.')}
 if(a==='mx'){if(!confirm('Delete this material? Students and teachers will no longer see it.'))return;jset('bshm.materials',(jget('bshm.materials')||[]).filter(m=>String(m.id)!==id));lg('Resource','Deleted a material');return render()}
 if(a==='ax'){if(!confirm('Delete this announcement?'))return;jset('bshm.ann.custom',(jget('bshm.ann.custom')||[]).filter(m=>String(m.id)!==id));lg('Announcement','Deleted');return render()}
 if(a==='add')return pg==='fac'?facNew():pg==='ann'?annNew():ent();
 if(a==='e')return ent(D[pg].find(r=>r.id===id));
 if(a==='x'){if(!confirm('Delete this record? This cannot be undone.'))return;D[pg]=D[pg].filter(r=>r.id!==id);lg(E[pg].l,'Deleted a record');save();if(pg==='assign')syncClasses();return render()}
 if(a==='fe'&&t)return facEdit(t);
 if(a==='rp'&&t){if(!confirm('Reset the password for '+t.name+'? Their current password will stop working.'))return;
  const pw=genPw(),salt=hex(rnd(8));return hashPw(salt,pw).then(h=>{const p=[t.salt,t.hash,t.mustChange];t.salt=salt;t.hash=h;t.mustChange=true;if(!saveAcc()){[t.salt,t.hash,t.mustChange]=p;return}lg('Faculty','Password reset for '+t.name);render();reveal('Password reset',t,pw)})}
 if(a==='tg'&&t){const off=t.status!=='disabled';if(off&&!confirm('Disable '+t.name+'? They cannot sign in until you enable the account again.'))return;
  t.status=off?'disabled':'active';if(!saveAcc()){t.status=off?'active':'disabled';return}lg('Faculty',(off?'Disabled ':'Enabled ')+t.name);render();return toast(off?'Account disabled.':'Account enabled.')}
 if(a==='fx'&&t){if(!confirm('Delete the account for '+t.name+'? This cannot be undone.'))return;D.assign=D.assign.filter(x=>x.facultyId!==t.id);save();const i=ACC.indexOf(t);ACC.splice(i,1);if(!saveAcc()){ACC.splice(i,0,t);return}lg('Faculty','Deleted '+t.name);render();return toast('Account deleted.')}
 if(a==='sv'){D.set.school=$('sn').value.trim()||D.set.school;D.set.ay=$('ay').value.trim()||D.set.ay;if(save()){render();toast('Settings saved.')}return}
 if(a==='pr')return print();
 if(a==='csv'){const c=[RP.h].concat(RP.r).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),l=document.createElement('a');
  l.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));l.download=RP.t.replace(/ /g,'-').toLowerCase()+'.csv';l.click()}}
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===DBK||e.key===UK||e.key===ACESBanners.KEY){load();render()}});

/* ---- admin sign-in gate ---- */
function start(){$('gate').hidden=true;$('app').hidden=false;load();syncClasses();$('dt').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});render()}
function gate(){const c=jget(CRED),first=!(c&&c.hash);
 $('gt').textContent=first?'Set up admin access':'Admin sign-in';$('gp').textContent=first?'First time here. Choose a password for the admin account.':'';
 $('gcw').hidden=!first;$('gb').textContent=first?'Save and continue':'Sign in';
 $('gf').onsubmit=ev=>{ev.preventDefault();showErr('gerr','');const pw=$('gpw').value,ok=()=>{try{sessionStorage.setItem(SESS,'1')}catch(e){}start()};
  if(first){if(pw.length<8)return showErr('gerr','Use at least 8 characters.');if(pw!==$('gpw2').value)return showErr('gerr','The two passwords do not match.');
   const salt=hex(rnd(8));hashPw(salt,pw).then(h=>{if(jset(CRED,{user:'admin',salt,hash:h}))ok()})}
  else hashPw(c.salt,pw).then(h=>{if(h!==c.hash){showErr('gerr','Wrong password.');return}ok()})};
 $('gpw').focus()}
$('out').onclick=()=>{try{sessionStorage.removeItem(SESS)}catch(e){}location.reload()};
let s=false;try{s=sessionStorage.getItem(SESS)==='1'&&!!(jget(CRED)&&jget(CRED).hash)}catch(e){}
s?start():gate();
})();
</script>
